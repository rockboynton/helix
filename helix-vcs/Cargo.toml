[package]
name = "helix-vcs"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
helix-core = { path = "../helix-core" }
helix-event = { path = "../helix-event" }
helix-stdx = { path = "../helix-stdx" }

tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "parking_lot", "macros"] }
parking_lot.workspace = true
arc-swap.workspace = true

gix = { version = "0.85.0", features = ["attributes", "parallel", "status", "blame", "max-performance", "sha1"], default-features = false, optional = true }
gix-jj = { package = "gix", version = "0.88.0", default-features = false, features = ["blob-diff"], optional = true }
imara-diff =  "0.2.0"
anyhow = "1"
log = "0.4"
jj-lib = { version = "=0.46.0", optional = true }
futures-executor = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
chrono = { version = "0.4", optional = true, default-features = false, features = ["clock"] }
etcetera = { workspace = true, optional = true }

[features]
git = ["gix"]
jj = ["dep:jj-lib", "dep:gix-jj", "dep:futures-executor", "dep:futures-util", "dep:chrono", "dep:etcetera"]

[dev-dependencies]
tempfile.workspace = true
prost = "0.14"

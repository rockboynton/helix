[book]
title = "Neohelix"
authors = ["Blaž Hrastnik"]
language = "en"
src = "src"

[output.html]
default-theme = "colibri"
preferred-dark-theme = "colibri"
git-repository-url = "https://github.com/rockboynton/helix"
edit-url-template = "https://github.com/rockboynton/helix/edit/neohelix/book/{path}"
additional-css = ["custom.css"]
additional-js = ["ts-query.js"]

[output.html.search]
use-boolean-and = true

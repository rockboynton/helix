# Frozen active NixOS overrides at the time of the Steel port, plus Steel LSP.
[language-server.haskell-language-server]
command = "haskell-language-server"
args = ["--lsp"]
[language-server.rust-analyzer.config]
cargo.targetDir = true
check.command = "clippy"
workspace.symbol.search.kind = "all_symbols"
[language-server.tinymist.config]
exportPdf = "onType"
outputPath = "$root/target/$dir/$name"
lint.enabled = true
lint.when = "onType"
formatterMode = "typstyle"
formatterProseWrap = true
projectResolution = "lockDatabase"
[language-server.rumdl]
command = "rumdl"
args = ["server"]
[language-server.steel-language-server]
command = "steel-language-server"
[[language]]
name = "haskell"
indent = { tab-width = 4, unit = "    " }
formatter = { command = "fourmolu", args = ["-i"] }
[[language]]
name = "ld"
file-types = ["ld", "x"]
[[language]]
name = "markdown"
formatter = { command = "rumdl", args = ["fmt", "-"] }
language-servers = ["rumdl"]
[[language]]
name = "nix"
language-servers = ["nixd"]
formatter = { command = "nixpkgs-fmt" }
[[language]]
name = "rust"
language-servers = ["rust-analyzer"]
[[language]]
name = "toml"
formatter = { command = "taplo", args = ["fmt", "-"] }
[[language]]
name = "typst"
auto-format = true
language-servers = ["tinymist"]
formatter = { command = "typstyle", args = ["--wrap-text", "--line-width=120"] }
[[language]]
name = "scheme"
language-servers = ["steel-language-server"]
